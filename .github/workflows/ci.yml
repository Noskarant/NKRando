name: Build NKRando
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Bottom sheet interaction smoke test
        if: github.event_name == 'pull_request'
        run: node scripts/sheet-smoke.mjs
      - name: GPS filter smoke test
        if: github.event_name == 'pull_request'
        run: node scripts/gps-smoke.mjs
      - name: Bergfex map tile smoke test
        if: github.event_name == 'pull_request'
        run: node scripts/map-tile-smoke.mjs
      - name: App-wide UX smoke test
        if: github.event_name == 'pull_request'
        run: node scripts/ux-smoke.mjs
      - name: 1-to-1 UI structural smoke test
        if: github.event_name == 'pull_request'
        run: node scripts/bergfex-clone-smoke.mjs
      - name: Feature integration smoke test
        if: github.event_name == 'pull_request'
        run: node scripts/features-smoke.mjs
      - name: Planning v3 smoke test
        if: github.event_name == 'pull_request'
        run: node scripts/planner-v3-smoke.mjs
      - name: Live navigation smoke test
        if: github.event_name == 'pull_request'
        run: node scripts/navigation-smoke.mjs
      - name: Completed activity analysis smoke test
        if: github.event_name == 'pull_request'
        run: node scripts/activity-analysis-smoke.mjs
      - name: Live tour API smoke test
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/tours-smoke.mjs
