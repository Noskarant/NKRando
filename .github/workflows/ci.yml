name: Build NKRando
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Live tour API smoke test
        if: github.event_name == 'pull_request'
        run: node scripts/tours-smoke.mjs
